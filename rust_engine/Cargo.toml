[package]
name = "teleological_engine"
version = "0.1.0"
edition = "2021"
authors = ["QPIS Contributors"]
description = "High-performance Recursive Teleological Back-Propagation Engine"

[lib]
name = "teleological_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.20"
pyo3 = { version = "0.20", features = ["extension-module"] }
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
