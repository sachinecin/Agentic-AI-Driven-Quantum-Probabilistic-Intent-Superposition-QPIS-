[package]
name = "qpis_rust_backprop"
version = "0.1.0"
edition = "2021"

[lib]
name = "qpis_rust_backprop"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.20"
pyo3 = { version = "0.20", features = ["extension-module"] }
ndarray = "0.15"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
